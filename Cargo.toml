[package]
name = "ebi_arithmetic"
version = "0.3.5"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = []
categories = ["command-line-utilities"]
description = "Exact arithmetic for Ebi - a stochastic process mining utility"
homepage = "https://ebitools.org"
repository = "https://github.com/BPM-Research-Group/ebi_arithmetic"
readme = "README.md"

[lib]
name = "ebi_arithmetic"
crate-type = ["cdylib", "lib"]

[features]
default = [ ]
exactarithmetic = []
approximatearithmetic = []

[dependencies]
anyhow = "1.0.100"
rand = "0.9.2"
malachite = { version="0.8.0", features = ["random"] }
serial_test = "3.2.0"
wgpu = "27.0.1"
bytemuck = "1.23.2"
pollster = "0.4.0"
rayon = "1.11.0"
itertools = "0.14.0"

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }

[[bench]]
name = "matrix_gpu"
harness = false

[profile.release]
debug = false
strip = true
panic = 'abort'
opt-level = 3
lto = true
codegen-units = 1
